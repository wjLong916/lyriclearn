server:
  port: 8080

spring:
  application:
    name: lyriclearn-backend
  datasource:
    url: jdbc:h2:mem:lyriclearn;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

# 积分体系参数（对应 PRD 7.2 / 7.3，运营可配置）
lyriclearn:
  points:
    base-reward: 10
    daily-cap-free: 30
    daily-cap-member: 100
    # CEFR 难度系数：A1/A2/B1/B2/C1+
    cefr:
      A1: 0.6
      A2: 0.8
      B1: 1.0
      B2: 1.3
      C1: 1.6
    quality:
      zero-max: 0.4
      mid-max: 0.7
      high-max: 0.9
      zero: 0
      mid: 0.5
      high: 1.0
      top: 1.2
    repeat:
      first: 1.0
      review: 0.3

logging:
  level:
    root: INFO
    com.lyriclearn: DEBUG
